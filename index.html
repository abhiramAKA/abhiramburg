<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мобильная Игра</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    </style>
    <!-- Подключаем официальное рабочее зеркало Яндекса напрямую -->
    <script src="https://yastatic.net"></script>
</head>
<body>

    <script>
    // --- СЦЕНА 1: ГЛАВНОЕ МЕНЮ ---
    class MainMenuScene extends Phaser.Scene {
        constructor() { 
            super({ key: 'MainMenuScene' }); 
        }
        create() {
            const cx = this.cameras.main.centerX;
            const cy = this.cameras.main.centerY;

            // Название игры
            this.add.text(cx, cy - 100, 'МЕГА ИГРА 2026', { 
                fontSize: '32px', fill: '#ffffff', fontFamily: 'Arial' 
            }).setOrigin(0.5);

            // Кнопка старта
            const startButton = this.add.text(cx, cy + 50, '[ НАЧАТЬ ИГРУ ]', { 
                fontSize: '28px', fill: '#00ffcc', backgroundColor: '#1e272e', padding: 10, fontFamily: 'Arial' 
            }).setOrigin(0.5).setInteractive();
            
            startButton.on('pointerdown', () => { 
                this.scene.start('GameplayScene'); 
            });
        }
    }

    // --- СЦЕНА 2: ИГРОВОЙ ПРОЦЕСС ---
    class GameplayScene extends Phaser.Scene {
        constructor() { 
            super({ key: 'GameplayScene' }); 
        }
        create() {
            const cx = this.cameras.main.centerX;
            const cy = this.cameras.main.centerY;

            this.add.text(cx, cy - 150, 'ИГРОВОЙ ПРОЦЕСС', { 
                fontSize: '24px', fill: '#ffff00', fontFamily: 'Arial' 
            }).setOrigin(0.5);

            this.score = 0;
            this.scoreText = this.add.text(cx, cy, 'Кликов: 0', { 
                fontSize: '40px', fill: '#ffffff', fontFamily: 'Arial' 
            }).setOrigin(0.5);

            // Красная кнопка-кликер
            const target = this.add.circle(cx, cy + 100, 60, 0xff4757).setInteractive();
            
            target.on('pointerdown', () => {
                this.score += 1;
                this.scoreText.setText('Кликов: ' + this.score);
            });

            // Назад в меню
            const backButton = this.add.text(cx, this.cameras.main.height - 80, 'В меню', { 
                fontSize: '20px', fill: '#aaaaaa', fontFamily: 'Arial' 
            }).setOrigin(0.5).setInteractive();
            
            backButton.on('pointerdown', () => { 
                this.scene.start('MainMenuScene'); 
            });
        }
    }

    // --- СБОРКА И ЗАПУСК ---
    window.onload = function() {
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: '#2d3436',
            scene: [MainMenuScene, GameplayScene]
        };
        const game = new Phaser.Game(config);
        window.addEventListener('resize', () => { game.scale.resize(window.innerWidth, window.innerHeight); });
    };
    </script>
</body>
</html>
