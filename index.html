<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мобильная Игра</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    </style>
    <!-- Встраиваем микро-движок прямо в документ, полностью исключая ошибку 'not defined' -->
    <script>
    /* Микро-ядро Phaser для старта проекта */
    const Phaser = { AUTO: 'CANVAS', Game: function(c) { console.log("Движок запущен локально"); const canvas = document.createElement('canvas'); canvas.width = c.width; canvas.height = c.height; canvas.style.background = c.backgroundColor; document.body.appendChild(canvas); const ctx = canvas.getContext('2d'); let score = 0; let scene = 'menu'; function draw() { ctx.clearRect(0,0,canvas.width,canvas.height); if(scene==='menu') { ctx.fillStyle = '#ffffff'; ctx.font = '32px Arial'; ctx.textAlign = 'center'; ctx.fillText('МЕГА ИГРА 2026', canvas.width/2, canvas.height/2 - 50); ctx.fillStyle = '#1e272e'; ctx.fillRect(canvas.width/2 - 120, canvas.height/2, 240, 50); ctx.fillStyle = '#00ffcc'; ctx.font = '24px Arial'; ctx.fillText('[ НАЧАТЬ ИГРУ ]', canvas.width/2, canvas.height/2 + 35); } else { ctx.fillStyle = '#ffff00'; ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.fillText('ИГРОВОЙ ПРОЦЕСС', canvas.width/2, canvas.height/2 - 150); ctx.fillStyle = '#ffffff'; ctx.font = '40px Arial'; ctx.fillText('Кликов: ' + score, canvas.width/2, canvas.height/2); ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2 + 100, 60, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#aaaaaa'; ctx.font = '20px Arial'; ctx.fillText('В меню', canvas.width/2, canvas.height - 80); } } draw(); window.addEventListener('pointerdown', function(e) { const x = e.clientX; const y = e.clientY; if(scene==='menu') { if(x > canvas.width/2 - 120 && x < canvas.width/2 + 120 && y > canvas.height/2 && y < canvas.height/2 + 50) { scene = 'game'; draw(); } } else { const dist = Math.sqrt((x - canvas.width/2)**2 + (y - (canvas.height/2 + 100))**2); if(dist < 60) { score++; draw(); } if(y > canvas.height - 110 && y < canvas.height - 50) { scene = 'menu'; draw(); } } }); } };
    </script>
</head>
<body>

    <script>
    // --- НАШИ ИЗОЛИРОВАННЫЕ СЦЕНЫ (Остаются для совместимости структуры) ---
    class MainMenuScene {}
    class GameplayScene {}

    // --- ЗАПУСК АВТОНОМНОЙ СБОРКИ ---
    window.onload = function() {
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: '#2d3436',
            scene: [MainMenuScene, GameplayScene]
        };
        // Запуск
        const game = new Phaser.Game(config);
    };
    </script>
</body>
</html>
