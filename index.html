<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match3 Game</title>
    <script>
        var path = window.location.pathname;
        if (!path.endsWith('/')) { path += '/'; }
        document.write('<base href="' + path + '" />');
    </script>
    <link rel="stylesheet" href="css/match3.css" />

    <script>
        // Эта функция вызывается самим Telegram при успешном входе пользователя
        window.onTelegramAuth = function (user) {
            if (user && user.username) {
                // Передаем имя пользователя обратно в C# среду выполнения Blazor
                DotNet.invokeMethodAsync('Match3Game', 'ReceiveTelegramUser', user.username)
                    .catch(err => console.error("Ошибка передачи данных в C#:", err));
            }
        };
    </script>
</head>
<body>
    <div id="app">Загрузка игры...</div>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Скрытый контейнер-шаблон для виджета Telegram, который мы будем использовать в меню -->
    <div id="telegram-widget-template" style="display:none;">
        <script async src="https://telegram.org" 
                data-telegram-login="abhiram_game_bot" 
                data-size="large" 
                data-radius="8" 
                data-onauth="onTelegramAuth(user)" 
                data-request-access="write">
        </script>
    </div>
</body>
</html>
