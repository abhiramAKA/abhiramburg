<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КХАМАЧ: Легенды Абхирамбурга</title>
    <link rel="stylesheet" href="styles.css?v=0.5.2">
</head>
<body style="margin: 0; padding: 0; background: #0c0806; overflow: hidden;">

    <!-- Живой задний план (Искры костра) -->
    <canvas id="bg-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>

    <!-- Главный контейнер игры (Mobile-First) -->
    <div id="game-container">
        
        <!-- Шапка игры -->
        <header id="game-header">
            <h1>КХАМАЧ</h1>
            <div id="sub-title">Легенды Абхирамбурга</div>
        </header>

        <!-- Основная рабочая область -->
        <main id="game-screen-area">
            
            <!-- Экран лагеря (Главное меню) -->
            <div id="screen-camp" class="game-screen">
                <div class="menu-banner">Лагерь <span style="color: #e6c280;">Ордена</span></div>
                <button class="btn-main" onclick="showScreen('screen-battle')">⚔️ Отправиться в Рейд</button>
                <button class="btn-main font-locked" disabled>🔨 Горнило (v0.6.0)</button>
                <button class="btn-main font-locked" disabled>🧪 Алхимия (v0.6.0)</button>
            </div>

            <!-- Экран боевой сессии (Рейд на Дракона) -->
            <div id="screen-battle" class="game-screen" style="display: none;">
                
                <!-- Инфо-панель Босса -->
                <div id="boss-panel">
                    <div id="boss-name">🔥 Огненный Дракон (Тир 1)</div>
                    <div class="hp-bar-container">
                        <div id="boss-hp-bar" class="hp-bar" style="width: 100%;"></div>
                        <span id="boss-hp-text">500 / 500 ОЗ</span>
                    </div>
                </div>

                <!-- Панель статуса раунда и Очков Действия -->
                <div id="battle-status-panel" style="width: 100%; max-width: 320px; margin: 4px auto; background: rgba(28, 21, 16, 0.85); border: 1px solid #4a3e31; border-radius: 4px; padding: 6px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #e6c280;">
                    <div id="battle-status-text" style="text-shadow: 1px 1px 1px #000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;">⚔️ Загрузка боя...</div>
                    <div id="battle-ap-display" style="font-weight: bold; background: #2a2015; padding: 2px 6px; border-radius: 3px; border: 1px solid #635341; color: #5dade2;">⚡ ОД: 3 / 3</div>
                </div>

                <!-- Матрица отряда -->
                <div id="squad-matrix">
                    <!-- Заполняется динамически из combat.js -->
                </div>

                <!-- Зона Match-3 игрового поля (8х8) -->
                <div id="combat-action-area">
                    <!-- Заполняется динамически из match3.js -->
                </div>

                <!-- Нижняя панель управления боем -->
                <div id="battle-controls">
                    <button class="btn-retreat" onclick="showScreen('screen-camp')">🏃 Отступить в лагерь</button>
                </div>
            </div>

        </main>

        <!-- Подвал с фиксированной версией -->
        <footer id="game-footer">
            <span>Клиент: v0.5.2</span>
        </footer>
    </div>

    <!-- Загрузка скриптов в строгой последовательности (Сброс кэша v0.5.2) -->
    <script src="game.js?v=0.5.2"></script>
    <script src="background.js?v=0.5.2"></script>
    <script src="match3.js?v=0.5.2"></script>
    <script src="combat.js?v=0.5.2"></script>

</body>
</html>
