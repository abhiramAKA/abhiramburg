<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мобильная Игра</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    </style>
    <!-- Загружаем движок напрямую (проверенное стабильное зеркало Яндекса) -->
    <script src="https://yastatic.net"></script>
</head>
<body>

    <!-- Подключаем наши полностью изолированные модули кода -->
    <script src="menu.js"></script>
    <script src="game.js"></script>

    <script>
        // Запуск игры происходит строго после полной загрузки всех скриптов
        window.onload = function() {
            const config = {
                type: Phaser.AUTO,
                width: window.innerWidth,
                height: window.innerHeight,
                backgroundColor: '#2d3436',
                // Подключаем наши сцены. Меню запустится первым
                scene: [MainMenuScene, GameplayScene]
            };
            const game = new Phaser.Game(config);
            window.addEventListener('resize', () => { game.scale.resize(window.innerWidth, window.innerHeight); });
        };
    </script>
</body>
</html>
