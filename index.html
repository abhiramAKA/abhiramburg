<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match3 Game</title>
    <script>
        var path = window.location.pathname;
        if (!path.endsWith('/')) { path += '/'; }
        document.write('<base href="' + path + '" />');
    </script>
    <link rel="stylesheet" href="css/match3.css" />

    <!-- Изолированный звуковой движок игры -->
    <script>
        window.audioEngine = {
            playMusic: function () {
                var music = document.getElementById('bg-music');
                if (music && music.paused) {
                    music.volume = 0.25; // Оптимальная громкость фоновой музыки
                    music.play().catch(function(error) {
                        console.log("Браузер заблокировал автозапуск. Ожидаем активности пользователя.");
                    });
                }
            },
            toggleMusic: function() {
                var music = document.getElementById('bg-music');
                if (music) {
                    if (music.paused) {
                        music.volume = 0.25;
                        music.play();
                    } else {
                        music.pause();
                    }
                }
            },
            playMatchSound: function () {
                var sound = document.getElementById('match-sound');
                if (sound) {
                    sound.currentTime = 0; // Мгновенный сброс для частых взрывов
                    sound.volume = 0.50; // Громкость эффектов чуть выше музыки
                    sound.play().catch(e => console.log("Ошибка воспроизведения звука эффекта"));
                }
            }
        };
    </script>
</head>
<body>
    <div id="app">Загрузка игры...</div>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Использование стабильных, разрешенных CDN-аудиопотоков без блокировок -->
    <!-- Фоновый трек: Эпический фэнтези-оркестр с боевыми барабанами -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>
    
    <!-- Эффект: Короткий сочный взрыв при уничтожении фишек -->
    <audio id="match-sound" preload="auto">
        <source src="https://mixkit.co" type="audio/wav">
    </audio>
</body>
</html>
