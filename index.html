<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КХАМАЧ: Легенды Абхирамбурга</title>
    <link rel="stylesheet" href="styles.css?v=0.5.0">
</head>
<body>

    <!-- Главный контейнер игры (Mobile-First) -->
    <div id="game-container">
        
        <!-- Шапка игры -->
        <header id="game-header">
            <h1>КХАМАЧ</h1>
            <div id="sub-title">Легенды Абхирамбурга</div>
        </header>

        <!-- Основная рабочая область (Экраны переключаются динамически через JS) -->
        <main id="game-screen-area">
            
            <!-- Экран лагеря (Главное меню) -->
            <div id="screen-camp" class="game-screen">
                <div class="menu-banner">Лагерь Ордена</div>
                <button class="btn-main" onclick="showScreen('screen-battle')">⚔️ Отправиться в Рейд</button>
                <button class="btn-main font-locked" disabled>🔨 Горнило (v0.6.0)</button>
                <button class="btn-main font-locked" disabled>🧪 Алхимия (v0.6.0)</button>
            </div>

            <!-- Экран боевой сессии (Рейд на Дракона) -->
            <div id="screen-battle" class="game-screen" style="display: none;">
                <!-- Инфо-панель Босса -->
                <div id="boss-panel">
                    <div id="boss-name">🔥 Огненный Дракон (Тир 1)</div>
                    <div class="hp-bar-container">
                        <div id="boss-hp-bar" class="hp-bar" style="width: 100%;"></div>
                        <span id="boss-hp-text">500 / 500 ОЗ</span>
                    </div>
                </div>

                <!-- Матрица отряда (Disciples 2 стиль) -->
                <div id="squad-matrix">
                    <!-- Заполняется динамически из combat.js -->
                </div>

                <!-- Зона Match-3 игрового поля -->
                <div id="combat-action-area">
                    <!-- Заполняется динамически из match3.js -->
                </div>

                <!-- Текстовый пошаговый лог боя -->
                <div id="combat-log-container">
                    <div id="combat-log"></div>
                </div>

                <!-- Нижняя панель управления боем -->
                <div id="battle-controls">
                    <button class="btn-retreat" onclick="showScreen('screen-camp')">🏃 Отступить в лагерь</button>
                </div>
            </div>

        </main>

        <!-- Подвал с фиксированной версией -->
        <footer id="game-footer">
            <span>Клиент: v0.5.0</span>
        </footer>
    </div>

    <!-- Подключение модулей логики (с защитой от кэширования браузером) -->
    <script src="background.js?v=0.5.0"></script>
    <script src="match3.js?v=0.5.0"></script>
    <script src="combat.js?v=0.5.0"></script>

    <script>
        // Глобальный объект данных для сохранения состояния MVP
        const combatData = {
            board: [],
            heroes: [
                { id: 1, name: "Воитель", hp: 150, maxHp: 150, role: "фронт-лево" },
                { id: 2, name: "Танк", hp: 120, maxHp: 120, role: "фронт-право" },
                { id: 3, name: "Маг", hp: 80, maxHp: 80, role: "тыл-лево" },
                { id: 4, name: "Рекрут", hp: 70, maxHp: 70, role: "тыл-право" }
            ],
            dragonBoss: { name: "Огненный Дракон", hp: 500, maxHp: 500 }
        };

        // Переключение экранов
        function showScreen(screenId) {
            document.querySelectorAll('.game-screen').forEach(s => s.style.display = 'none');
            const target = document.getElementById(screenId);
            if (target) {
                target.style.display = 'flex';
                
                // Переинициализация боя при заходе в рейд
                if (screenId === 'screen-battle') {
                    setTimeout(() => {
                        rebuildActionArea();
                        generateValidBoard();
                        renderMatch3Board();
                        if (typeof initCombatLog === 'function') initCombatLog();
                        if (typeof renderSquad === 'function') renderSquad();
                    }, 20);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
             showScreen('screen-camp');
        });
        
        function appendToLog(text, type) {
            const log = document.getElementById('combat-log');
            if (!log) return;
            const msg = document.createElement('div');
            msg.className = `log-msg msg-${type}`;
            msg.innerText = text;
            log.appendChild(msg);
            log.scrollTop = log.scrollHeight;
        }
        
        function refreshBattleUI() {
            renderMatch3Board();
            if (typeof renderSquad === 'function') renderSquad();
            
            // Обновление полоски ХП босса
            const bossHpBar = document.getElementById('boss-hp-bar');
            const bossHpText = document.getElementById('boss-hp-text');
            if (bossHpBar && bossHpText) {
                const pct = Math.max(0, (combatData.dragonBoss.hp / combatData.dragonBoss.maxHp) * 100);
                bossHpBar.style.width = pct + '%';
                bossHpText.innerText = `${Math.max(0, combatData.dragonBoss.hp)} / ${combatData.dragonBoss.maxHp} ОЗ`;
            }
        }
    </script>
</body>
</html>
