<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Abhiramburg Match3 Game</title>
    <base href="/abhiramburg/" />
    <link href="css/match3.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;,">
    <style>
        html, body {
            margin: 0; padding: 0; background-color: #1a1a1a;
            font-family: 'Segoe UI', sans-serif; color: white;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        #blazor-error-ui { display: none !important; }
    </style>
</head>
<body>
    <div id="app">
        <div style="display: flex; min-height: 100vh; justify-content: center; align-items: center; color: white;">
            <h2>Загрузка города...</h2>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    
    <!-- Используем официальный проверенный CDN TON Connect UI версии 2.x -->
    <script src="https://unpkg.com"></script>

    <script>
        let tonConnectUI = null;
        window.tonWalletAddress = ""; 

        window.initTonConnect = function () {
            if (tonConnectUI) return "Уже инициализировано";
            try {
                // ИСПРАВЛЕНО: Правильное создание объекта для TON Connect UI v2
                tonConnectUI = new TonConnectUI.TonConnectUI({
                    manifestUrl: "https://github.io"
                });

                tonConnectUI.onStatusChange(wallet => {
                    if (wallet && wallet.account) {
                        window.tonWalletAddress = wallet.account.address;
                    } else {
                        window.tonWalletAddress = "";
                    }
                });
                return "Успешная инициализация";
            } catch (e) {
                console.error("Ошибка TON Connect:", e);
                return "Ошибка инициализации: " + e.message;
            }
        };

        window.openTonConnectModal = async function () {
            window.initTonConnect();
            if (!tonConnectUI) {
                alert("Критическая ошибка: TON Connect не создан");
                return "No UI";
            }
            try {
                // Открываем настоящее окно выбора кошельков (Tonkeeper, MyTonWallet и др.)
                await tonConnectUI.openModal();
                return "Modal Opened";
            } catch (error) {
                alert("Ошибка открытия кошелька: " + error.message);
                return error.message;
            }
        };

        window.getTonWalletAddress = function () {
            if (tonConnectUI && tonConnectUI.account) {
                return tonConnectUI.account.address;
            }
            return window.tonWalletAddress || "";
        };

        window.disconnectTonWallet = async function () {
            if (tonConnectUI && tonConnectUI.connected) {
                await tonConnectUI.disconnect();
                window.tonWalletAddress = "";
            }
            return "Disconnected";
        };
    </script>
</body>
</html>
