<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>КХАМАЧ — Восхождение Рейдов</title>
    <script>
        // ИСПРАВЛЕННЫЙ МОДУЛЬНЫЙ ЗАГРУЗЧИК (v2.5.0-BETA)
        (function() {
            const timestamp = Date.now();
            
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'styles.css?t=' + timestamp;
            document.head.appendChild(link);

            const scripts = [
                'game.js',
                'background.js',
                'audio-engine.js',
                'match3-fx.js',
                'match3-input.js',
                'match3.js',
                'match3-progression.js',
                'town-engine.js',
                'squad-engine.js',
                'town-dom.js',
                'combat-dom.js',
                'combat.js',
                'game-listeners.js'
            ];

            function injectScript(index) {
                if (index >= scripts.length) {
                    console.log("КХАМАЧ: Модули v2.5.0 успешно загружены.");
                    if (typeof initDispatcherModule === 'function') {
                        initDispatcherModule();
                    }
                    return;
                }
                
                const script = document.createElement('script');
                script.src = scripts[index] + '?t=' + timestamp;
                script.async = false; 
                script.onload = function() { injectScript(index + 1); };
                document.head.appendChild(script);
            }

            injectScript(0);
        })();
    </script>
</head>
<body>
    <!-- Холст для искр костра -->
    <canvas id="bg-canvas"></canvas>

    <!-- Общий контейнер интерфейса -->
    <div id="game-interface">
        
        <!-- ================= ГЛАВНОЕ МЕНЮ ================= -->
        <div id="main-menu" class="game-window" style="display: flex;">
            <h1>КХАМАЧ</h1>
            <span class="subtitle">Рейды в Горнило Рун</span>
            
            <div class="gold-counter-display" style="color: #ffd700; font-weight: bold; margin-bottom: 5px; font-size: 16px;">🪙 0 Золота</div>
            
            <!-- ДИНАМИЧЕСКИЙ БЛОК ИНВЕНТАРЯ ГЛАВНОГО ЭКРАНА -->
            <div id="main-menu-inventory" style="background: rgba(0, 0, 0, 0.4); border: 1px double #544432; padding: 6px 10px; margin-bottom: 12px; font-size: 12px; border-radius: 4px; box-sizing: border-box;"></div>
            
            <p>Древний Дракон пробудился в недрах подземелья. Соберите свой отряд, заряжайте шкалы суперсил через камни стихий и сокрушите огнедышащую тварь в пошаговой тактической битве.</p>
            
            <div class="menu-row">
                <button id="to-combat-btn" class="menu-btn">В БОЙ</button>
                <button id="info-btn" class="info-btn">❓</button>
            </div>
            <div class="menu-row">
                <button id="to-forge-btn" class="menu-btn">⚒️ Кузня</button>
            </div>
            <div class="menu-row">
                <button id="to-alchemy-btn" class="menu-btn">🧪 Лаборатория</button>
            </div>
            <div class="menu-row">
                <button id="to-clans-btn" class="menu-btn" style="background: linear-gradient(to bottom, #1f2d42 0%, #101724 100%); border-color: #324e6e;">🛡️ Кланы</button>
            </div>
            <div class="menu-row">
                <button id="to-squad-btn" class="menu-btn">👥 Отряд</button>
                <button id="squad-info-btn" class="info-btn">❓</button>
            </div>
            
            <!-- Контрольная метка версии сборки -->
            <div id="game-version" class="version-footer">v2.5.0-BETA</div>
        </div>

        <!-- Контейнеры для динамических модулей генерации DOM -->
        <div id="dynamic-town-screens"></div>
        <div id="dynamic-combat-screen"></div>

    </div>
</body>
</html>
