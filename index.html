<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мобильная Игра</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    </style>
    
    <!-- Используем сверхнадежное зеркало Cloudflare, которое отлично работает в РФ -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- Подключаем наши изолированные файлы сценариев -->
    <script src="menu.js"></script>
    <script src="game.js"></script>

    <script>
        // Запускаем игру строго после того, как ВСЕ скрипты полностью скачаются
        window.onload = function() {
            // Проверка на случай, если интернет совсем пропал
            if (typeof Phaser === 'undefined') {
                alert("Не удалось загрузить движок игры. Пожалуйста, обновите страницу или проверьте интернет-соединение.");
                return;
            }

            const config = {
                type: Phaser.AUTO,
                width: window.innerWidth,
                height: window.innerHeight,
                backgroundColor: '#2d3436', // Красивый темно-серый фон
                scene: [MainMenuScene, GameplayScene]
            };

            const game = new Phaser.Game(config);

            window.addEventListener('resize', () => { 
                game.scale.resize(window.innerWidth, window.innerHeight); 
            });
        };
    </script>
</body>
</html>
