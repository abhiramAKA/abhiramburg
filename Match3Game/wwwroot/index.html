<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Abhiramburg Match3 Game</title>
    <base href="/abhiramburg/" />
    <link href="css/match3.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;,">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        /* Принудительно скрываем системную панель ошибок Blazor, чтобы она не висела на экране */
        #blazor-error-ui {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="app">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: white;">
            <h2>Загрузка города...</h2>
        </div>
    </div>

    <div id="blazor-error-ui">
        Произошла ошибка. <a href="" class="reload">Перезагрузить</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <script type="text/javascript">
        (function(l) {
            if (l.search === '?') {
                var q = {}; l.search.slice(1).split('&').forEach(function(v) {
                    var a = v.split('='); q[a] = a.slice(1).join('=').toLowerCase();
                });
                if (q.p !== undefined) {
                    window.history.replaceState(null, null, l.pathname.slice(0, -1) + (q.p || '') + l.search);
                }
            }
        }(window.location));
    </script>

    <script src="https://unpkg.com"></script>

    <script>
        let tonConnectUI = null;

        window.initTonConnect = function (dotNetHelper) {
            if (tonConnectUI) return;

            tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: window.location.origin + '/abhiramburg/tonconnect-manifest.json'
            });

            tonConnectUI.onStatusChange(wallet => {
                if (wallet && wallet.account) {
                    dotNetHelper.invokeMethodAsync('OnWalletConnected', wallet.account.address);
                } else {
                    dotNetHelper.invokeMethodAsync('OnWalletDisconnected');
                }
            });
        };

        window.openTonConnectModal = async function () {
            if (!tonConnectUI) return;
            try {
                await tonConnectUI.openModal();
            } catch (error) {
                console.error("Ошибка открытия TON Connect:", error);
            }
        };

        window.disconnectTonWallet = async function () {
            if (tonConnectUI && tonConnectUI.connected) {
                await tonConnectUI.disconnect();
            }
        };
    </script>
</body>
</html>
